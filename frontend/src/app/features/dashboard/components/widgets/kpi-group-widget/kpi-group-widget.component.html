<div class="grid gap-4 h-full items-stretch" 
    [class.grid-cols-1]="visibleCount === 1" 
    [class.grid-cols-2]="visibleCount === 2"
    [class.grid-cols-3]="visibleCount === 3" 
    [class.grid-cols-4]="visibleCount === 4">

    <div *ngFor="let kpi of visibleKpis; let i = index" (click)="navigateToDetail(kpi)"
        class="kpi-card group"
        [style.animation-delay]="(i * 0.06) + 's'"
        style="animation: fadeIn 0.4s ease both;">

        <!-- Top row: label + icon -->
        <div class="flex items-start justify-between">
            <!-- Icon Bubble -->
            <div class="kpi-icon-wrap flex-shrink-0" [ngClass]="kpi?.bubbleClass || 'bubble-teal'">
                <mat-icon>{{ kpi?.icon || 'analytics' }}</mat-icon>
            </div>

            <!-- Trend pill (top right) -->
            <span *ngIf="kpi?.progress != null" class="trend-pill"
                [ngClass]="kpi?.progressColorClass === 'fill-red' ? 'trend-down' : 'trend-up'">
                <mat-icon>{{ kpi?.progressColorClass === 'fill-red' ? 'south' : 'north' }}</mat-icon>
                {{ kpi?.progress ?? 0 }}%
            </span>
        </div>

        <!-- Main Value -->
        <div class="mt-3">
            <h3 class="tabular-nums leading-none font-extrabold tracking-tight text-gray-900"
                style="font-size: clamp(2rem, 3.5vw, 2.8rem); color: var(--text-primary);">
                {{ kpi?.displayValue ?? 0 }}
            </h3>
            <p class="mt-1 font-semibold text-xs uppercase tracking-widest" 
               style="color: var(--text-muted); letter-spacing: 0.10em;">
                {{ kpi?.title }}
            </p>
        </div>

        <!-- Progress Bar -->
        <div class="mt-auto pt-4">
            <div class="progress-bar-wrap">
                <div [style.width.%]="kpi?.progress ?? 0" 
                     class="h-full flex-shrink-0 rounded-full transition-all duration-700"
                     [ngClass]="kpi?.progressColorClass === 'fill-red'
                        ? 'bg-gradient-to-r from-[#E5323E] to-[#E07B12]'
                        : 'bg-gradient-to-r from-[#1A6FE8] to-[#0EA5C9]'">
                </div>
            </div>
            <p class="mt-2 text-[10px] font-medium" style="color: var(--text-muted);">
                {{ kpi?.subtitle || ('Meta ' + (kpi?.timeframe || 'Mensual')) }}
            </p>
        </div>

        <!-- Context Menu -->
        <button mat-icon-button [matMenuTriggerFor]="timeMenu" (click)="$event.stopPropagation()"
            class="!absolute bottom-2 right-2 !scale-75 opacity-0 group-hover:opacity-100 transition-opacity"
            style="color: var(--text-muted);">
            <mat-icon>more_horiz</mat-icon>
        </button>
        <mat-menu #timeMenu="matMenu" class="glass-menu">
            <button mat-menu-item (click)="onTimeframeChange(kpi, 'Hoy')">Hoy</button>
            <button mat-menu-item (click)="onTimeframeChange(kpi, '7 Días')">7 Días</button>
            <button mat-menu-item (click)="onTimeframeChange(kpi, '30 Días')">30 Días</button>
        </mat-menu>
    </div>

</div>
