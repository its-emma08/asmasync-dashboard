<div class="fixed inset-0 z-[9999] flex bg-[#EEF2F7] dark:bg-[#0b1426]">
  <aside class="w-64 border-r border-white/10 bg-white/40 dark:bg-slate-900/30 backdrop-blur-xl hidden md:flex flex-col p-6 space-y-8">
    <div class="h-8 w-28 bg-gray-200/40 dark:bg-white/5 rounded-xl shimmer"></div>
    <div class="space-y-3">
      <div *ngFor="let i of [1,2,3,4,5]" class="h-9 w-full bg-gray-200/30 dark:bg-white/4 rounded-xl shimmer"></div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col">
    <header class="h-16 border-b border-white/10 bg-white/30 dark:bg-slate-900/20 backdrop-blur-md flex items-center justify-between px-6">
      <div class="h-9 w-72 bg-gray-200/30 dark:bg-white/5 rounded-2xl shimmer"></div>
      <div class="flex items-center gap-3">
        <div class="h-9 w-24 bg-gray-200/30 dark:bg-white/5 rounded-full shimmer"></div>
        <div class="h-9 w-9 bg-gray-200/40 dark:bg-white/5 rounded-xl shimmer"></div>
      </div>
    </header>

    <div class="p-6 space-y-6">
      <!-- Header strip -->
      <div class="flex justify-between items-end">
        <div class="space-y-2">
          <div class="h-3 w-36 bg-gray-200/40 dark:bg-white/5 rounded-full shimmer"></div>
          <div class="h-10 w-64 bg-gray-200/40 dark:bg-white/5 rounded-xl shimmer"></div>
        </div>
        <div class="glass-card-premium px-5 py-3 flex items-center gap-5">
          <div *ngFor="let i of [1,2,3,4]" class="flex flex-col items-center gap-1">
            <div class="h-3 w-10 bg-gray-200/40 dark:bg-white/5 rounded shimmer"></div>
            <div class="h-7 w-14 bg-gray-200/40 dark:bg-white/5 rounded-lg shimmer"></div>
          </div>
        </div>
      </div>

      <!-- Bento grid -->
      <div class="grid grid-cols-3 md:grid-cols-4 gap-4">
        <!-- KPI row -->
        <div *ngFor="let i of [1,2,3,4]" 
             class="glass-card-premium h-28 col-span-1 p-4 flex flex-col justify-between">
          <div class="h-3 w-20 bg-gray-200/40 dark:bg-white/5 rounded shimmer"></div>
          <div>
            <div class="h-8 w-12 bg-gray-200/40 dark:bg-white/5 rounded-lg shimmer"></div>
            <div class="h-3 w-24 bg-gray-200/20 dark:bg-white/4 rounded mt-2 shimmer"></div>
          </div>
        </div>

        <!-- Alerts panel -->
        <div class="glass-card-premium h-40 col-span-2 p-4 space-y-3">
          <div class="h-4 w-32 bg-gray-200/40 dark:bg-white/5 rounded shimmer"></div>
          <div class="h-3 w-full bg-gray-200/20 dark:bg-white/4 rounded shimmer"></div>
          <div class="h-3 w-5/6 bg-gray-200/20 dark:bg-white/4 rounded shimmer"></div>
        </div>

        <!-- Weather mini -->
        <div class="glass-card-premium h-40 col-span-2 p-4 space-y-3">
          <div class="h-4 w-24 bg-gray-200/40 dark:bg-white/5 rounded shimmer"></div>
          <div class="flex items-center gap-4">
            <div class="h-16 w-16 bg-gray-200/20 dark:bg-white/4 rounded-2xl shimmer"></div>
            <div class="space-y-2">
              <div class="h-6 w-14 bg-gray-200/30 dark:bg-white/5 rounded-lg shimmer"></div>
              <div class="h-3 w-20 bg-gray-200/20 dark:bg-white/4 rounded shimmer"></div>
            </div>
          </div>
        </div>

        <!-- Patient table -->
        <div class="glass-card-premium col-span-full h-52 p-4 space-y-3">
          <div class="h-4 w-40 bg-gray-200/40 dark:bg-white/5 rounded shimmer"></div>
          <div class="space-y-2">
            <div *ngFor="let i of [1,2,3]" class="h-10 w-full bg-gray-200/15 dark:bg-white/3 rounded-xl shimmer"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
